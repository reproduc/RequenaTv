<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requena TV - En Vivo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;font-family:Arial,sans-serif;color:#fff}
.player{width:min(100%,1100px);background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden}
.video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.controls{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#181818}
button{border:0;border-radius:6px;background:#e50914;color:#fff;width:44px;height:38px;font-size:18px;cursor:pointer}
button:hover{background:#c70812}
.volume{width:120px;cursor:pointer}
.volume-text{min-width:42px;font-size:13px}
.live{margin-left:auto;font-size:12px;font-weight:bold;white-space:nowrap}
.status{padding:9px 12px;background:#101010;color:#ccc;text-align:center;font-size:13px}
@media(max-width:600px){.controls{gap:7px;padding:8px}.volume{width:90px}button{width:40px;height:36px}}
</style>
</head>
<body>
<div class="player">
<div class="video-wrap">
<video id="video" playsinline preload="metadata" aria-label="Requena TV en vivo">Tu navegador no soporta video HTML5.</video>
</div>
<div class="controls">
<button id="play" type="button" title="Reproducir">▶</button>
<button id="mute" type="button" title="Silenciar">🔊</button>
<input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="1" title="Volumen" aria-label="Volumen">
<span id="volumeText" class="volume-text">100%</span>
<span class="live">● EN VIVO</span>
</div>
<div id="status" class="status">Conectando con la señal...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const STREAM_URL="https://lbgo.bozztv.com/ssh101/ssh101/requena123/playlist.m3u8";
const video=document.getElementById("video");
const playBtn=document.getElementById("play");
const muteBtn=document.getElementById("mute");
const volume=document.getElementById("volume");
const volumeText=document.getElementById("volumeText");
const status=document.getElementById("status");
let hls=null,reconnectTimer=null;

function setStatus(t){status.textContent=t}
function updateControls(){
 playBtn.textContent=video.paused?"▶":"❚❚";
 playBtn.title=video.paused?"Reproducir":"Pausar";
 const v=video.muted?0:video.volume;
 volume.value=v;
 volumeText.textContent=Math.round(v*100)+"%";
 muteBtn.textContent=(video.muted||video.volume===0)?"🔇":"🔊";
 muteBtn.title=(video.muted||video.volume===0)?"Activar sonido":"Silenciar";
}
function reconnect(){
 clearTimeout(reconnectTimer);
 reconnectTimer=setTimeout(startPlayer,3000);
}
function startPlayer(){
 clearTimeout(reconnectTimer);
 if(hls){hls.destroy();hls=null}
 setStatus("Conectando con la señal en vivo...");
 if(window.Hls&&Hls.isSupported()){
  hls=new Hls({enableWorker:true,lowLatencyMode:true,liveSyncDurationCount:3,backBufferLength:30,maxBufferLength:20,manifestLoadingMaxRetry:5,levelLoadingMaxRetry:5,fragLoadingMaxRetry:5});
  hls.loadSource(STREAM_URL);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,function(){setStatus("Señal lista. Pulsa ▶ para reproducir.")});
  hls.on(Hls.Events.ERROR,function(event,data){
   if(!data||!data.fatal)return;
   if(data.type===Hls.ErrorTypes.NETWORK_ERROR){setStatus("Problema de conexión. Reconectando...");hls.startLoad();reconnect()}
   else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){setStatus("Recuperando el reproductor...");hls.recoverMediaError()}
   else{setStatus("No se pudo reproducir la señal. Reintentando...");reconnect()}
  });
  return;
 }
 if(video.canPlayType("application/vnd.apple.mpegurl")){
  video.src=STREAM_URL;
  video.load();
  setStatus("Señal lista. Pulsa ▶ para reproducir.");
  return;
 }
 setStatus("Este navegador no admite reproducción HLS.");
}
playBtn.addEventListener("click",async function(){
 try{if(video.paused)await video.play();else video.pause()}
 catch(e){setStatus("No se pudo iniciar. Pulsa nuevamente ▶.")}
 updateControls();
});
muteBtn.addEventListener("click",function(){
 video.muted=!video.muted;
 if(!video.muted&&video.volume===0)video.volume=.8;
 updateControls();
});
volume.addEventListener("input",function(){
 video.volume=Number(this.value);
 video.muted=video.volume===0;
 updateControls();
});
video.addEventListener("playing",function(){setStatus("Requena TV - En vivo");updateControls()});
video.addEventListener("pause",updateControls);
video.addEventListener("waiting",function(){setStatus("Cargando señal en vivo...")});
video.addEventListener("error",function(){setStatus("Error de reproducción. Reconectando...");reconnect()});
video.volume=1;
updateControls();
startPlayer();
</script>
</body>
</html>
