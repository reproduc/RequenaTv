        /* Reproductor de video en vivo HLS */
        .video-player-container {
            width: 100%;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0;
            box-sizing: border-box;
            position: relative;
            z-index: 5;
            background: #000;
            overflow: hidden;
        }

        /* Video 100% ancho - proporción 16:9 */
        .live-video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            min-height: 0;
            background: #000;
            object-fit: contain;
            border-radius: 0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .45);
        }

        .video-status {
            margin-top: 8px;
            color: #fff;
            text-align: center;
            font: 14px Arial, sans-serif;
            text-shadow: 0 1px 3px #000;
        }

        @media (max-width: 600px) {
            .video-player-container {
                width: 100%;
                margin: 10px 0;
                padding: 0;
            }

            .live-video {
                width: 100%;
                aspect-ratio: 16 / 9;
                height: auto;
                min-height: 0;
                border-radius: 0;
            }
        }

        /* Estilo general para videos */
        video {
            max-width: 100%;
        }

        /* Estilo para la imagen de fondo */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            background-image: url('imagenes/logo.png'); 
            background-size: cover; 
            background-position: center; 
            z-index: -1; 
            filter: blur(10px); 
        }

        /* Asegura que el body y html ocupen el 100% */
        body, html {

            padding: 0;
            height: 100%;
            overflow: auto;

        /* Estilos para los iconos de redes sociales */

        /* Estilo para el modal del chat */
        .chat-modal {
            display: none; 
            position: fixed;
            top: 0;

        }

        .chat-modal iframe {

            top: 10px;

            cursor: pointer;

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const HLS_URL = "https://rtmp.eliniktech.com/IquitosTv/video.m3u8";
        const video = document.getElementById("liveVideo");
        const status = document.getElementById("videoStatus");
        let hls = null;

        function setVideoStatus(message) {
            if (status) status.textContent = message;
        }

        function startVideo() {
            if (!video) return;

            setVideoStatus("Conectando con la señal en vivo...");

            /* Safari/iPhone/iPad: reproducción HLS nativa */
            if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = HLS_URL;
                video.load();
                return;
            }

            /* Chrome, Edge, Firefox y otros navegadores: HLS.js */
            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    liveSyncDurationCount: 3,
                    liveDurationInfinity: true,
                    backBufferLength: 30,
                    maxBufferLength: 20,
                    manifestLoadingMaxRetry: 4,
                    levelLoadingMaxRetry: 4,
                    fragLoadingMaxRetry: 4
                });

                hls.attachMedia(video);

                hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                    hls.loadSource(HLS_URL);
                });

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    setVideoStatus("Requena Television en vivo");
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (!data || !data.fatal) return;

                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        setVideoStatus("Conectando nuevamente con la señal...");
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        setVideoStatus("Recuperando el reproductor...");
                        hls.recoverMediaError();
                    } else {
                        setVideoStatus("No se pudo cargar la señal en vivo.");
                        hls.destroy();
                    }
                });

                return;
            }

            setVideoStatus("Este navegador no admite reproducción HLS.");
        }

        if (video) {
            video.addEventListener("playing", function () {
                setVideoStatus("Requena Television en vivo");
            });

            video.addEventListener("waiting", function () {
                setVideoStatus("Cargando señal en vivo...");
            });

            video.addEventListener("canplay", function () {
                setVideoStatus("Requena Television en vivo");
            });

            video.addEventListener("error", function () {
                setVideoStatus("Error al reproducir la señal en vivo. Verifique la señal HLS.");
            });

            /* Espera a que HLS.js esté disponible antes de iniciar */
            if (window.Hls) {
                startVideo();
            } else {
                window.addEventListener("load", startVideo);
            }
        }
    </script>

    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installButtonWrapper').style.display = 'block'; // Muestra el botón
        });

        document.getElementById('installButton').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Usuario aceptó la instalación');
                    } else {
                        console.log('Usuario rechazó la instalación');
                    }
                });
                deferredPrompt = null; // Resetea el prompt
                document.getElementById('installButtonWrapper').style.display = 'none'; // Oculta el botón
            }
        });

        // Lógica para abrir y cerrar el menú
        function toggleNav() {
            const sidebar = document.getElementById("mySidebar");
            const main = document.getElementById("main");
            
            if (sidebar.style.width === "250px") {
                closeNav();
            } else {
                openNav();
            }
        }

        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("main").style.marginLeft = "0";
        }

        // Cerrar el menú al hacer clic fuera de él
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById("mySidebar");
            const button = document.querySelector('.openbtn');

            if (sidebar.style.width === "250px" && !sidebar.contains(event.target) && !button.contains(event.target)) {
                closeNav();
            }
        });

    </script>

                    .catch(err => console.log('Error al registrar el Service Worker:', err));
